# Seneca-TRBench Configuration
# Copy this to config.yaml and set your API keys in .env file

api_providers:
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: "https://api.openai.com/v1"
    models:
      # GPT-5 Series (API tanımları)
      - "gpt-5"
      - "gpt-5-mini"
      - "gpt-5-nano"
      - "gpt-5-chat-latest"
      - "gpt-5-codex"
      # GPT-4 Series (Legacy)
      - "gpt-4o"
      - "gpt-4o-mini"
      - "gpt-4-turbo"
      - "gpt-4"
      - "gpt-3.5-turbo"

  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    models:
      # Claude 4.5 Series (Latest - En Yeni)
      - "claude-sonnet-4-5-20250929"
      - "claude-haiku-4-5-20251001"
      # Claude 4.1 Series
      - "claude-opus-4-1-20250805"
      # Claude 3 Series (Legacy)
      - "claude-3-opus-20240229"
      - "claude-3-sonnet-20240229"
      - "claude-3-haiku-20240307"

  together:
    api_key: ${TOGETHER_API_KEY}
    base_url: "https://api.together.xyz/v1"
    models:
      - "meta-llama/Llama-3-70b-chat-hf"
      - "meta-llama/Llama-3-8b-chat-hf"
      - "mistralai/Mixtral-8x7B-Instruct-v0.1"
      - "NousResearch/Nous-Hermes-2-Mixtral-8x7B-DPO"

  gemini:
    api_key: ${GEMINI_API_KEY}
    base_url: "https://generativelanguage.googleapis.com"
    api_version: "v1beta"
    models:
      - "gemini-2.5-pro"
      - "gemini-2.5-flash"
      - "gemini-flash-lite-latest"

  # --- Yeni Sağlayıcılar ---

  openrouter:
    api_key: ${OPENROUTER_API_KEY}
    base_url: "https://openrouter.ai/api/v1"
    site_url: "https://github.com/alicankiraz1/seneca-trbench"
    site_name: "Seneca-TRBench"
    models:
      - "openai/gpt-4o"
      - "anthropic/claude-3.5-sonnet"
      - "google/gemini-2.5-pro"
      - "meta-llama/llama-3-70b-instruct"

  ollama:
    # API key gerekmez, Ollama lokal çalışır
    base_url: "http://localhost:11434/v1"
    models:
      - "llama3"
      - "mistral"
      - "gemma2"
      - "qwen2"

  lmstudio:
    # API key gerekmez, LM Studio lokal çalışır
    base_url: "http://localhost:1234/v1"
    models:
      - "loaded-model"

local:
  vllm_port: 8000
  vllm_host: "127.0.0.1"
  gpu_memory_utilization: 0.9
  tensor_parallel_size: 1
  download_dir: "./models"
  max_model_len: 4096

# Judge (Puanlama) Ayarları
# provider ve model alanlarını değiştirerek farklı bir judge kullanabilirsiniz.
# CLI'den --judge-provider ve --judge-model ile de geçersiz kılınabilir.
judge:
  provider: ${JUDGE_PROVIDER}
  model: ${JUDGE_MODEL}
  temperature: 0.1
  max_tokens: 1500
  timeout: 30
  parallel_workers: 10

test_settings:
  batch_size: 10
  timeout_seconds: 60
  save_intermediate: true
  intermediate_dir: "./results/intermediate"
  max_retries: 3
  retry_delay: 2

paths:
  mcq_data: "data/MCQ-Türkçe Benchmark.json"
  saq_data: "data/SAQ-Türkçe-Benchmark.json"
  results_dir: "./results"
  logs_dir: "./logs"

output:
  save_json: true
  save_markdown: true
  detailed_errors: true
  include_prompts: false
